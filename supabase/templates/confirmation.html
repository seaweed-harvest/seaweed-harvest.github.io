<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm your Seaweed Harvest account</title>
</head>
<body style="margin:0; padding:0; background:#eef7f5; color:#173f3a; font-family:Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%; background:#eef7f5;">
    <tr>
      <td align="center" style="padding:32px 12px;">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="width:100%; max-width:600px; background:#ffffff; border:1px solid #c7e2dd; border-radius:8px; overflow:hidden;">
          <tr><td style="height:7px; background:#0f766e; font-size:0; line-height:0;">&nbsp;</td></tr>
          <tr>
            <td style="padding:36px 42px 38px;">
              <img src="https://seaweed-harvest.com/assets/images/seaweed-harvest-logo.png" width="230" alt="Seaweed Harvest" style="display:block; width:230px; max-width:72%; height:auto; border:0;">
              <div style="width:46px; height:3px; margin:28px 0 24px; background:#efc75e;"></div>
              <h2 style="margin:0 0 14px; color:#173f3a; font-size:21px; line-height:1.3; font-weight:700; letter-spacing:0;">Confirm your email</h2>
              <p style="margin:0 0 26px; color:#365f59; font-size:16px; line-height:1.6;">Confirm your email address to finish setting up your Seaweed Harvest account.</p>
              <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                <tr><td style="border-radius:7px; background:#0f766e;"><a href="{{ .ConfirmationURL }}" style="display:inline-block; padding:13px 22px; color:#ffffff; font-size:16px; line-height:1.2; font-weight:700; text-decoration:none; border-radius:7px;">Confirm email</a></td></tr>
              </table>
              <p style="margin:28px 0 0; color:#6b8581; font-size:13px; line-height:1.55;">If you did not create this account, you can safely ignore this email.</p>
            </td>
          </tr>
          <tr><td style="padding:14px 24px; background:#f7fbfa; border-top:1px solid #d9ebe7; text-align:center; color:#6b8581; font-size:12px; line-height:1.5;">by Cascadia Nature-based Solutions.</td></tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
