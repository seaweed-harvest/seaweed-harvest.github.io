name: Apply Mawimbi backup export runtime release

on:
  push:
    branches:
      - release/mawimbi-backup-export-live-20260901
    paths:
      - ".github/workflows/mawimbi-backup-export-runtime-patch.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact runtime release branch
        uses: actions/checkout@v5
        with:
          ref: release/mawimbi-backup-export-live-20260901
          fetch-depth: 0

      - name: Restore the source-verified runtime files
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode > /tmp/mawimbi-backup-runtime.zip <<'PATCH'
          
          PATCH
          printf '%s  %s\n' '62df23a1b31626fe0f6722a1aa2070e3405ccbff1ab814d3be3cf8065c56769e' /tmp/mawimbi-backup-runtime.zip | sha256sum -c -
          unzip -o /tmp/mawimbi-backup-runtime.zip
          printf '%s  %s\n' 'eebe6b12d15524df768ebcacb2af4ff06e1fbe8ce1ae2fd90c8b9b76060ab57a' admin_backups.html | sha256sum -c -
          printf '%s  %s\n' 'b9ae0fd84196a650715dfdaaf257912c0d86160dd4c0abb4963ac06198683bad' assets/js/admin_backups_summary.js | sha256sum -c -

      - name: Validate the live runtime pair
        run: |
          node --check assets/js/admin_backups_summary.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          page = Path('admin_backups.html').read_text(encoding='utf-8')
          script = Path('assets/js/admin_backups_summary.js').read_text(encoding='utf-8')
          HTMLParser().feed(page)
          required_page = (
              'id="backupExportButton"',
              'id="backupExportProgress"',
              'id="backupDownloadLink"',
              'admin_backups_summary.js?v=3',
              'Operational records are not changed.',
          )
          required_script = (
              'authClient.functions.invoke("system-backup"',
              'action: "create"',
              'action: "status"',
              'action: "download"',
              'window.confirm',
              'POLL_TIMEOUT_MS = 15 * 60 * 1000',
          )
          for marker in required_page:
              assert marker in page, marker
          for marker in required_script:
              assert marker in script, marker
          assert 'Export backend not connected' not in page
          assert 'Export backend not connected' not in script
          print('Runtime backup export pair passed.')
          PY

      - name: Commit only the two approved runtime files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin_backups.html assets/js/admin_backups_summary.js
          git commit -m "Enable verified Mawimbi backup ZIP export"
          git push origin HEAD:release/mawimbi-backup-export-live-20260901
