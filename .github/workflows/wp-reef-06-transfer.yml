name: WP-REEF-06 verified renderer transfer

on:
  push:
    branches:
      - release/wp-reef-06-shell-parity-20260828

permissions:
  contents: write

jobs:
  reconstruct:
    if: contains(github.event.head_commit.message, '[wp-reef-06-transfer]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@v5
        with:
          ref: release/wp-reef-06-shell-parity-20260828
          fetch-depth: 0

      - name: Import and verify exact approved Training renderer
        shell: bash
        env:
          RENDERER_ARTIFACT_URL: "https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-2298-81fa-93e6-182dbd3712a6/raw?se=2026-08-28T05%3A41%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=d9673e2e-9c7c-5369-8d21-563231a56dc0&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-28T03%3A33%3A12Z&ske=2026-08-29T03%3A33%3A12Z&sks=b&skv=2026-02-06&sig=ZU2xquousXiydJ5b5Kgdj5Z78NfGy2yJuXru3yOtdJ4%3D"
        run: |
          set -euo pipefail
          rm -rf /tmp/wp-reef-06-renderer /tmp/wp-reef-06-renderer.zip
          mkdir -p /tmp/wp-reef-06-renderer
          curl --fail --location --retry 2 "$RENDERER_ARTIFACT_URL" -o /tmp/wp-reef-06-renderer.zip
          unzip -q /tmp/wp-reef-06-renderer.zip -d /tmp/wp-reef-06-renderer
          source_file="$(find /tmp/wp-reef-06-renderer -type f -name reef_nursery_training_public.js -print -quit)"
          test -n "$source_file"
          cp "$source_file" assets/js/reef_nursery_training_public.js
          actual="$(git hash-object assets/js/reef_nursery_training_public.js)"
          expected="a4bcba914fc96409006ef87127f1cc447a381e9a"
          test "$actual" = "$expected" || {
            echo "Renderer hash mismatch: expected $expected, got $actual" >&2
            exit 1
          }
          echo "PASS: renderer hash $actual"

      - name: Commit clean verified release branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .wp-reef-06-transfer
          rm -f .github/workflows/wp-reef-06-transfer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Complete verified WP-REEF-06 production runtime"
          git push origin HEAD:release/wp-reef-06-shell-parity-20260828
