<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b52">
  <title>Reflection Ledger</title>
  <link rel="stylesheet" href="./assets/green_space.css?v=4">
</head>
<body>
  <header class="girls-header">
    <div class="girls-header-inner">
      <a class="girls-brand" href="./" aria-label="Green Space Log">
        <span class="girls-brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20h10"></path><path d="M10 20c5.5-2.5 4-9 4-9s-6.5 1-6 7"></path><path d="M9.5 9.5C8 5 3 5 3 5s0 5 4.5 6.5"></path><path d="M14 11c.5-4 4-5 7-5 0 3-1.5 6-5 7"></path></svg>
        </span>
        <span><strong>Green Space Log</strong><small>Observation &amp; Reflection</small></span>
      </a>
      <nav class="girls-nav" aria-label="Green Space Log navigation">
        <a href="./"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path><path d="M13.5 4.5 19 10"></path><path d="m13 11 6.5-6.5a2.12 2.12 0 0 1 3 3L16 14l-4 1 1-4Z"></path></svg><span>Form</span></a>
        <a href="./map.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3V6Z"></path><path d="M9 3v15"></path><path d="M15 6v15"></path></svg><span>Map</span></a>
        <a href="./ledger.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18"></path><path d="M3 12h18"></path><path d="M3 19h18"></path><path d="M8 5v14"></path></svg><span>Ledger</span></a>
      </nav>
    </div>
  </header>

  <main class="girls-main girls-wide-main">
    <header class="girls-page-heading girls-heading-row">
      <div><p class="girls-eyebrow">Shared class view</p><h1>Reflection Ledger</h1></div>
      <span id="girlsLedgerCount" class="girls-count">0 entries</span>
    </header>

    <section class="girls-ledger-tools" aria-label="Ledger filters">
      <label class="girls-field">
        <span>Search</span>
        <input id="girlsLedgerSearch" type="search" placeholder="Student, code or green space">
      </label>
      <label class="girls-field">
        <span>Entry</span>
        <select id="girlsLedgerType">
          <option value="">All entries</option>
          <option value="project">Project Start</option>
          <option value="observation">Observation</option>
          <option value="weekly_reflection">Distillation + haiku</option>
          <option value="final_reflection">Final reflection</option>
        </select>
      </label>
      <label class="girls-field">
        <span>Week</span>
        <select id="girlsLedgerWeek">
          <option value="">All weeks</option>
          <option value="1">Week 1</option><option value="2">Week 2</option><option value="3">Week 3</option><option value="4">Week 4</option>
          <option value="5">Week 5</option><option value="6">Week 6</option><option value="7">Week 7</option><option value="8">Week 8</option>
        </select>
      </label>
      <button id="girlsExportLedger" class="girls-secondary-action girls-export-action" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>
        Export CSV
      </button>
    </section>

    <section id="girlsLedgerSelectionToolbar" class="girls-ledger-selection-toolbar" hidden aria-label="Selected ledger actions">
      <strong id="girlsLedgerSelectionCount">0 selected</strong>
      <button id="girlsEditSelected" class="girls-secondary-action" type="button">Edit</button>
      <button id="girlsPublishSelected" class="girls-secondary-action" type="button">Publish</button>
      <button id="girlsUnpublishSelected" class="girls-secondary-action" type="button">Unpublish</button>
      <button id="girlsDeleteSelected" class="girls-secondary-action girls-danger-action" type="button">Delete</button>
    </section>

    <section class="girls-ledger-section">
      <div class="girls-ledger-pagination">
        <button id="girlsLedgerPrevious" class="girls-secondary-action" type="button">Previous</button>
        <span id="girlsLedgerPageStatus" class="girls-table-status">Page 1</span>
        <button id="girlsLedgerNext" class="girls-secondary-action" type="button">Next</button>
      </div>
      <div class="girls-table-wrap responsive-table-wrap">
        <table class="girls-ledger-table">
          <thead>
            <tr>
              <th class="girls-select-column"><input id="girlsSelectVisible" type="checkbox" aria-label="Select all visible rows"></th>
              <th><button type="button" data-ledger-sort="date">Date<span class="girls-sort-indicator" aria-hidden="true"></span></button></th>
              <th><button type="button" data-ledger-sort="participant_name">Student<span class="girls-sort-indicator" aria-hidden="true"></span></button></th>
              <th><button type="button" data-ledger-sort="green_space_name">Green space<span class="girls-sort-indicator" aria-hidden="true"></span></button></th>
              <th><button type="button" data-ledger-sort="entry_type">Entry<span class="girls-sort-indicator" aria-hidden="true"></span></button></th>
              <th><button type="button" data-ledger-sort="week_number">Week<span class="girls-sort-indicator" aria-hidden="true"></span></button></th>
              <th><button type="button" data-ledger-sort="start_time">Time<span class="girls-sort-indicator" aria-hidden="true"></span></button></th>
              <th><button type="button" data-ledger-sort="photo_path">Photo<span class="girls-sort-indicator" aria-hidden="true"></span></button></th>
              <th><button type="button" data-ledger-sort="is_published">Status<span class="girls-sort-indicator" aria-hidden="true"></span></button></th>
              <th>Preview</th>
            </tr>
          </thead>
          <tbody id="girlsLedgerRows"><tr><td colspan="10">Loading entries...</td></tr></tbody>
        </table>
      </div>
      <p id="girlsLedgerStatus" class="girls-table-status" role="status"></p>
    </section>
  </main>

  <dialog id="girlsEntryDialog" class="girls-dialog girls-entry-dialog">
    <div class="girls-dialog-panel">
      <div class="girls-dialog-heading">
        <div><span id="girlsEntryType" class="girls-entry-badge"></span><h2 id="girlsEntryTitle"></h2></div>
        <button id="girlsCloseEntry" type="button" aria-label="Close">&times;</button>
      </div>
      <dl id="girlsEntryMeta" class="girls-entry-meta"></dl>
      <img id="girlsEntryPhoto" class="girls-entry-photo" alt="" hidden>
      <div id="girlsEntryContent" class="girls-entry-content"></div>
    </div>
  </dialog>

  <dialog id="girlsEditDialog" class="girls-dialog girls-edit-dialog">
    <form id="girlsEditForm" class="girls-dialog-panel">
      <div class="girls-dialog-heading">
        <div><span class="girls-entry-badge">Edit record</span><h2 id="girlsEditTitle"></h2></div>
        <button id="girlsCloseEdit" type="button" aria-label="Close">&times;</button>
      </div>
      <div id="girlsEditFields" class="girls-edit-fields"></div>
      <p id="girlsEditStatus" class="girls-form-status" role="status" aria-live="polite"></p>
      <div class="girls-dialog-actions">
        <button id="girlsCancelEdit" type="button">Cancel</button>
        <button class="girls-primary-action" type="submit">Save changes</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="../assets/js/fixed_table_scrollbar.js?v=1"></script>
  <script type="module" src="./assets/green_space_ledger.js?v=4"></script>
  <script type="module" src="../assets/js/site_feedback.js?v=5"></script>
</body>
</html>
