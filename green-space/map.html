<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b52">
  <title>Green Space Map</title>
  <link rel="stylesheet" href="../assets/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="./assets/green_space.css">
</head>
<body>
  <header class="girls-header">
    <div class="girls-header-inner">
      <a class="girls-brand" href="./" aria-label="Green Space Log">
        <span class="girls-brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20h10"></path><path d="M10 20c5.5-2.5 4-9 4-9s-6.5 1-6 7"></path><path d="M9.5 9.5C8 5 3 5 3 5s0 5 4.5 6.5"></path><path d="M14 11c.5-4 4-5 7-5 0 3-1.5 6-5 7"></path></svg>
        </span>
        <span><strong>Green Space Log</strong><small>Observation &amp; Reflection</small></span>
      </a>
      <nav class="girls-nav" aria-label="Green Space Log navigation">
        <a href="./"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path><path d="M13.5 4.5 19 10"></path><path d="m13 11 6.5-6.5a2.12 2.12 0 0 1 3 3L16 14l-4 1 1-4Z"></path></svg><span>Form</span></a>
        <a href="./map.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3V6Z"></path><path d="M9 3v15"></path><path d="M15 6v15"></path></svg><span>Map</span></a>
        <a href="./ledger.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18"></path><path d="M3 12h18"></path><path d="M3 19h18"></path><path d="M8 5v14"></path></svg><span>Ledger</span></a>
      </nav>
    </div>
  </header>

  <main class="girls-main girls-wide-main">
    <header class="girls-page-heading girls-heading-row">
      <div><p class="girls-eyebrow">Shared class view</p><h1>Green Space Map</h1></div>
      <span id="girlsMapCount" class="girls-count">0 spaces</span>
    </header>

    <section class="girls-map-section">
      <div id="girlsMap" class="girls-map" role="application" aria-label="Student green-space map"></div>
      <p id="girlsMapStatus" class="girls-empty-state" role="status">Loading green spaces...</p>
    </section>

    <details class="girls-list-section girls-list-details">
      <summary class="girls-list-summary">
        <span>
          <strong>Green Space List</strong>
          <small>Open the list to find or focus a location.</small>
        </span>
        <span id="girlsMapListCount" class="girls-count">0 spaces</span>
      </summary>
      <div class="girls-list-body">
        <label class="girls-compact-search">
          <span>Search green spaces</span>
          <input id="girlsMapSearch" type="search" placeholder="Name, code or place">
        </label>
        <div class="girls-table-wrap map-table-wrap">
          <table class="girls-map-list-table">
            <thead>
              <tr>
                <th>Green space</th>
                <th>Participant</th>
                <th>Code</th>
                <th>Entries</th>
                <th>Latest entry</th>
              </tr>
            </thead>
            <tbody id="girlsMapList"></tbody>
          </table>
        </div>
      </div>
    </details>
  </main>

  <dialog id="girlsMapGalleryDialog" class="girls-dialog girls-map-gallery-dialog" aria-labelledby="girlsMapGalleryTitle">
    <div class="girls-dialog-panel">
      <div class="girls-dialog-heading">
        <div>
          <h2 id="girlsMapGalleryTitle">Project photos</h2>
          <p id="girlsMapGalleryStatus" class="girls-section-copy"></p>
        </div>
        <button id="girlsCloseMapGallery" type="button" aria-label="Close">&times;</button>
      </div>
      <div id="girlsMapGalleryGrid" class="girls-public-gallery-grid"></div>
    </div>
  </dialog>

  <dialog id="girlsMapPhotoViewer" class="girls-dialog girls-photo-dialog" aria-labelledby="girlsMapPhotoViewerTitle">
    <div class="girls-dialog-panel girls-photo-dialog-panel">
      <div class="girls-dialog-heading">
        <h2 id="girlsMapPhotoViewerTitle">Photo preview</h2>
        <button id="girlsCloseMapPhotoViewer" type="button" aria-label="Close">&times;</button>
      </div>
      <img id="girlsMapPhotoViewerImage" alt="Selected green-space photo">
      <p id="girlsMapPhotoViewerName"></p>
    </div>
  </dialog>

  <script src="../assets/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="../assets/js/fixed_table_scrollbar.js?v=1"></script>
  <script type="module" src="./assets/green_space_map.js"></script>
  <script type="module" src="../assets/js/site_feedback.js?v=5"></script>
</body>
</html>
