<!doctype html>
<html lang="en">
<head>

        </span>
        <span><strong>GIRLS</strong><small>Green Space Reflection</small></span>

      <nav class="girls-nav" aria-label="GIRLS navigation">
        <a href="./"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path><path d="M13.5 4.5 19 10"></path><path d="m13 11 6.5-6.5a2.12 2.12 0 0 1 3 3L16 14l-4 1 1-4Z"></path></svg><span>Form</span></a>
        <a href="./map.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3V6Z"></path><path d="M9 3v15"></path><path d="M15 6v15"></path></svg><span>Map</span></a>

  <main class="girls-main girls-wide-main">
    <header class="girls-page-heading girls-heading-row">
      <div><p class="girls-eyebrow">Shared class view</p><h1>Green Space Map</h1></div>
      <span id="girlsMapCount" class="girls-count">0 spaces</span>
    </header>

    <section class="girls-map-section">
      <div id="girlsMap" class="girls-map" role="application" aria-label="Student green-space map"></div>
      <p id="girlsMapStatus" class="girls-empty-state" role="status">Loading green spaces...</p>
    </section>

    <section class="girls-list-section">
      <div class="girls-section-heading">
        <h2>Green spaces</h2>
        <label class="girls-compact-search">
          <span class="visually-hidden">Search green spaces</span>
          <input id="girlsMapSearch" type="search" placeholder="Search name or place">
        </label>
      </div>
      <div id="girlsMapList" class="girls-space-list"></div>
    </section>
  </main>

  <script src="../assets/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="./assets/girls_map.js"></script>
