<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <meta name="robots" content="noindex,nofollow">
  <title>RO processing Water - Mawimbi - Seaweed Harvest</title>
  <link rel="stylesheet" href="./assets/css/ag.css">
  <link rel="stylesheet" href="./assets/css/form_foundation.css?v=2">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon.ico" sizes="any">
  <script type="module" src="./assets/js/pwa_bootstrap.js"></script>
</head>
<body class="admin-console-page form-record-page mawimbi-ro-page" data-auth-pending>
  <header class="app-header">
    <div class="app-header-inner">
      <div><p class="eyebrow">Seaweed Harvest · Mawimbi</p><h1>RO processing Water</h1></div>
      <div class="header-actions admin-header-controls">
        <nav class="app-nav" aria-label="Main navigation"><a href="./home.html">Home</a><a href="./records.html">Records</a></nav>
      </div>
    </div>
  </header>
  <main class="app-shell admin-shell admin-layout form-record-layout">
    <aside class="admin-sidebar form-page-sidebar" aria-label="Application menu"><h2>Mawimbi</h2><a href="./home.html">Dashboard</a><a href="./site_water_sample.html">Coastal Water Samples</a><a href="./records.html">Records</a></aside>
    <section class="admin-content admin-page-section form-page-content">
      <section class="panel form-record-panel">
        <form id="mawimbiRoForm" class="standard-form standard-form-linear-layout">
          <fieldset><legend>Daily monitoring</legend>
            <label>Date <input id="roRecordedOn" type="date" required></label>
            <label>Pure water flow rate (L/min) <input id="roPureFlow" type="number" step="0.01" min="0" max="100000" inputmode="decimal" required></label>
            <label>Wastewater flow rate (L/min) <input id="roWasteFlow" type="number" step="0.01" min="0" max="100000" inputmode="decimal" required></label>
            <label>Membrane front pressure (PSI) <input id="roPressure" type="number" step="0.01" min="0" max="10000" inputmode="decimal" required></label>
            <label>Permeate water TDS (ppm) <input id="roTds" type="number" step="0.001" min="0" max="1000000" inputmode="decimal" required></label>
          </fieldset>
          <div class="button-row standard-form-actions">
            <button id="saveMaRo" type="submit">Save RO reading</button>
            <button id="clearMaRo" type="button">Clear</button>
            <p id="mawimbiRoStatus" class="admin-status" aria-live="polite"></p>
          </div>
        </form>
      </section>
      <section class="panel form-record-panel">
        <div class="section-head compact"><h2>Recent RO records</h2><button id="refreshMaRo" type="button">Refresh</button></div>
        <p id="roHistoryStatus" class="admin-status" aria-live="polite"></p>
        <div class="responsive-table-wrap">
          <table class="management-table admin-data-table">
            <thead><tr><th>Date</th><th>Pure water (L/min)</th><th>Wastewater (L/min)</th><th>Pressure (PSI)</th><th>Permeate TDS (ppm)</th><th>Recorded by</th></tr></thead>
            <tbody id="mawimbiRoHistory"><tr><td colspan="6">Loading…</td></tr></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>
  <script type="module" src="./assets/js/admin_page.js?v=35"></script>
  <script type="module" src="./assets/js/mawimbi_ro_monitoring.js?v=1"></script>
</body>
</html>
