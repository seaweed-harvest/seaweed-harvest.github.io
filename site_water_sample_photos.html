<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Coastal sample photos - Seaweed Harvest</title>
  <link rel="stylesheet" href="./assets/css/ag.css">
  <link rel="stylesheet" href="./assets/css/form_foundation.css?v=2">
  <link rel="stylesheet" href="./assets/css/stock_photos.css?v=2">
  <link rel="stylesheet" href="./assets/css/mawimbi_photo_actions.css">
  <script type="module" src="./assets/js/pwa_bootstrap.js"></script>
</head>
<body class="admin-console-page form-record-page site-water-photo-page" data-auth-pending>
  <header class="app-header"><div class="app-header-inner">
    <div><p class="eyebrow">Seaweed Harvest · Site Water Sample</p><h1>Sample photos</h1></div>
    <nav class="app-nav"><a href="./today.html?records=site-sample">Records</a><a href="./site_water_sample.html">New sample</a></nav>
  </div></header>
  <main class="app-shell admin-shell">
    <section class="panel form-record-panel">
      <h2 id="sitePhotoHeading">Coastal water sample</h2>
      <p id="sitePhotoDetail" class="stock-photo-helper"></p>
      <p id="sitePhotoStatus" class="admin-status" aria-live="polite"></p>
      <div id="sitePhotoGallery" class="stock-photo-gallery"></div>
      <form id="sitePhotoAddForm" class="standard-form" hidden>
        <fieldset><legend>Attach photos</legend>
          <div class="standard-photo-toolbar mawimbi-photo-toolbar">
  <button id="sitePhotoTake" class="standard-photo-action" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4 16 6h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3l1.5-2z"></path><circle cx="12" cy="13" r="3"></circle></svg><span>Take photo</span></button>
  <button id="sitePhotoChoose" class="standard-photo-action" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="m21 15-5-5L5 21"></path></svg><span>Choose photos</span></button>
</div>
          <input id="sitePhotoCamera" class="standard-hidden-file" type="file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
          <input id="sitePhotoFiles" class="standard-hidden-file" type="file" accept="image/*" multiple tabindex="-1" aria-hidden="true">
          <div id="sitePhotoPreview" class="stock-photo-preview" aria-live="polite"></div>
        </fieldset>
        <div class="button-row standard-form-actions"><button id="sitePhotoSave" type="submit">Attach photos to sample</button></div>
      </form>
    </section>
  </main>
  <script type="module" src="./assets/js/admin_page.js?v=35"></script>
  <script type="module" src="./assets/js/site_water_sample_photos.js?v=1"></script>
</body>
</html>
